<!DOCTYPE html>
<html>

<head>

<title>Our Memories 💖</title>

 <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="5 memories.css">

</head>

<body>

<div class="background"></div>

<h1>Our Favourite Memories 💕</h1>

<p class="subtitle">
Click each picture 💌
</p>

<div class="gallery">

<img src="pic.jpeg" class="photo p1"
onclick="showNote('Bubu 💖\n\nI don\'t know how you manage it, but somehow every photo of you becomes my favourite.\n\nAnd yes, even this pouty face that you\'re probably making on purpose 🤭🎀 You make my world a lot prettier just by being in it.')">

<img src="pic1.jpeg" class="photo p2"
onclick="showNote('Look at this tiny little Bubu 🥹\n\nIf I could go back in time for just one minute, I\'d tell this little girl that she\'s going to grow up into someone truly special.\n\nAnd that one day she\'s going to be loved more than she can imagine. 💕')">

<img src="pic2.jpeg" class="photo p3"
onclick="showNote('My little Pinu 🥹💖 Looking at this picture makes me wonder how many dreams this tiny girl had. I am sooo happy that she grew up into this amazing person I know today. No matter how many birthdays pass, you will always be my cute little Pinu. 🌸✨')">

<img src="pic3.jpeg" class="photo p4"
onclick="showNote('One of my favourite things about us is that we can turn even the silliest moments into memories worth keeping. Thank you for making ordinary moments feel special. 💖')">

<img src="pic4.jpeg" class="photo p5"
onclick="showNote('Forget princesses. This picture proves you were born a tiny apsara. ✨🌸')">

<img src="pic5.jpeg" class="photo p6"
onclick="showNote('The grace, the confidence, the elegance...You look absolutely beautiful here, and I don\'t think any words can do this picture justice. 🌸💕')">

<img src="pic6.jpeg" class="photo p7"
onclick="showNote('One of my favourite memories with you! It\'s moments like these that make me sooo grateful to have you in my life. 💖')">

<img src="pic7.jpeg" class="photo p8"
onclick="showNote('This picture is a reminder of how much fun we have together. Whether we\'re out exploring or just goofing around, every moment with you is a memory I cherish. 💕')">

<img src="pic8.jpeg" class="photo p9"
onclick="showNote('The flower is pretty, but it\'s not as pretty as you. 🌸💖')">

<img src="pic9.jpeg" class="photo p10"
onclick="showNote('Thanks for being a part of so many of my favourite memories! I can\'t wait to make many more with you. 💖')">

</div>

<div id="popup">

<div id="popupContent">

<span onclick="closeNote()">✖</span>

<p id="noteText"></p>

</div>

</div>

<button class="next"
onclick="location.href='final.html'">

One Last Thing 💖

</button>

<script>

function showNote(note){

document.getElementById("popup").style.display="flex";

document.getElementById("noteText").innerHTML=note;

}

function closeNote(){

document.getElementById("popup").style.display="none";

}

</script>

</body>

</html>
